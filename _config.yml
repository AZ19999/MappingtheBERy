# change the followings to match your Github username and repo name
baseurl: "/MappingMBTA" # the name of your github repo
url: "https://az19999.github.io" # the url of your github pages (change BCDigSchol to your username)

# site information used in page title, meta data etc.
title: "Mapping the MBTA's History"
description: Looking at the history of America's Oldest Public Transportation System @ Boston College

# color theme for links
theme-color: indigo # indigo|yellow|pink|green|stone|

# nav bar settings and links
nav-menu:
  - title: About  
    link: index
  - title: Map
    link: map
  - title: Findings
    link: findings
  - title: Methodology
    submenu:
      - title: Mapping
        link: mapmethods
      - title: Sentiment Analysis
        link: sentimentmethods
  - title: Reflection
    link: Reflection
  - title: Bibliography
    link: bibliography

# sets whether a search bar appears on the site header
search-bar: false

hide-footer: false # set to true to hide the footer
footer-message: Put Your Footer Message Here | CC BY-NC License
footer-submessage:  By Alexander Zhu, with the Digital Scholarship Group, Boston College
footer-submessage-link: https://ds.bc.edu

# google-analytics: // if you want to use Google analytics, include your ID here

# sets number of items display per page, if using a blog
paginate: 5

include:
  - _pages

# jekyll plugins - no need to change
plugins:
    - jekyll-seo-tag
    - jekyll-feed
    - jekyll-paginate
    - jekyll-postcss-v2
